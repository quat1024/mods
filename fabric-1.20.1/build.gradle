plugins {
	id "mod-setup-fabric"
}

modSetup.go {
	ver = "1.20.1"
	
	mods {
		rebind_narrator
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${project.floaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1" // https://notes.highlysuspect.agency/versions.html
	
	modRebind_narratorImplementation modSetup.lib("Amecs-Reborn-2.0.2+mc1.21.1.jar")
}