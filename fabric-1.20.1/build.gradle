plugins {
	id "mod-setup-fabric"
}

modSetup.go {
	ver = "1.20.1"
	
	mods {
		rebind_narrator
		crowmap
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${project.floaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1" // https://notes.highlysuspect.agency/versions.html
	
	modRebind_narratorImplementation modSetup.lib("amecs-1.3.10+mc.1.20.1.jar")
	modRebind_narratorImplementation modSetup.lib("amecsapi-1.20-1.4.0+mc1.20-pre1.jar")
	modRebind_narratorImplementation modSetup.lib("nmuk-1.1.1+mc1.20.1.jar")
}