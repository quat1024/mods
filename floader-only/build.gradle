plugins {
	id "java"
}

repositories {
	maven {
		url = "https://maven.fabricmc.net/"
		content {
			includeGroup "net.fabricmc"
		}
	}
}

dependencies {
	implementation "net.fabricmc:fabric-loader:${project.floaderVersion}"
}

configurations {
	consumable("floaderOnlyElements")
}

artifacts {
	floaderOnlyElements tasks.jar
}