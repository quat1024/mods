modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = "${issues}"
logoFile = "${modid}_icon.png"

[[mods]]
modId = "${modid}"
version = "${version}"
displayName = "${name}"
description = "${description}"
authors = "${author}"

[[mixins]]
config = "${modid}.mixins.json"

[[dependencies.${modid}]]
modId="modder_name_lib"
type="required"
versionRange="*"
ordering="AFTER"
side="BOTH"
