plugins {
	id "java"
	id "net.neoforged.moddev" version "2.0.95" // https://projects.neoforged.net/neoforged/ModDevGradle
}

archivesBaseName = "${rootProject.name}-neo-1.21.1"

neoForge {
	version "21.5.75" // https://projects.neoforged.net/neoforged/neoforge
	
	runs {
		client {
			client()
		}
	}
}

configurations {
	//dependencies to be included unshaded
	//TODO: this absolutely should be for shading instead of direct ziptree splatting
	// just havent set up shade plugin yet + itll interact funny with run configs blehh
	DependencyScopeConfiguration unshade = dependencyScope("unshade").get()
	
	//(the jar task will resolve them against this one to decide what to actually put into the jar)
	ResolvableConfiguration unshadeClasspath = resolvable("unshadeClasspath") { it.extendsFrom(unshade) }.get()
	
	//hang them off the regular configurations too (?)
	implementation.extendsFrom unshade
	compileClasspath.extendsFrom unshadeClasspath
}

dependencies {
	unshade project(path: ":vanilla", configuration: "minecraft1_21_1ApiElements")
}

def makeMod(String sourceSetName) {
	println "neo 1.21 mod ${sourceSetName}"
	SourceSet set = sourceSets.create(sourceSetName)

	//inherit from main sourceset (contains code shared across all neo 1.21 mods)
	set.compileClasspath += sourceSets.main.compileClasspath
	set.runtimeClasspath += sourceSets.main.runtimeClasspath
	project.dependencies.add(set.implementationConfigurationName, sourceSets.main.output)
	
	//jar task
	def jarTask = tasks.register("${set.name}Jar", Jar) {
		archivesBaseName = set.name
		destinationDirectory = tasks.jar.destinationDirectory
		
		from set.output //this mod
		from sourceSets.main.output //shared across all neo 1.21 mods
		from configurations.unshadeClasspath.collect { zipTree it } //splat contents of 'unshade' directly into the jar
	}
	tasks.named("jar") { dependsOn jarTask }
	
	//slap them in a configuration i guess
	artifacts {
		apiElements jarTask
		runtimeElements jarTask
	}
	
	//i have no idea brooo TODO fix run configs
	neoForge {
		mods {
			"${set.name}" {
				sourceSet set
				sourceSet sourceSets.main
				//TODO PROBABLY need to include :vanilla in here somehow...
			}
		}
	}
}

makeMod("testmod")
makeMod("testmod2")
