plugins {
	id "mod-setup-fabric"
}

modSetup.go {
	ver = "1.21.1"
	
	mods {
		rebind_narrator
		crowmap
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${project.floaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.3+1.21.1"
	
	modRebind_narratorImplementation modSetup.lib("Amecs-Reborn-2.0.2+mc1.21.1.jar")
}