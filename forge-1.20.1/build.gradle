plugins {
	id "mod-setup-forge-via-mdg"
}

legacyForge {
	version "1.20.1-47.3.0" // https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
}

modSetup.go {
	ver = "1.20.1"
	
	mods {
		rebind_narrator {
			legacyForgeMixinConfigs += "rebind_narrator.mixins.json"
		}
		crowmap {
			legacyForgeMixinConfigs += "crowmap.mixins.json"
		}
	}
}