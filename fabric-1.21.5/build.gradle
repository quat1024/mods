plugins {
	id "mod-setup-fabric"
}

modSetup.go {
	ver = "1.21.5"
	
	mods {
		rebind_narrator
		crowmap
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${project.floaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.127.1+1.21.5"
	
	modRebindNarratorImplementation modSetup.lib("Amecs-Reborn-2.0.2+mc1.21.5.jar")
}