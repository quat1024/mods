plugins {
	id "java"
	id "agency.highlysuspect.minivan" version "0.5"
	id "maven-publish"
}

repositories {
	maven {
		url = "https://repo.spongepowered.org/repository/maven-public/"
		content {
			includeGroup "org.spongepowered"
		}
	}
}

