import agency.highlysuspect.minivan.prov.MinecraftProvider
import com.unascribed.flexver.FlexVerComparator

plugins {
	id "vanilla-setup"
	id "agency.highlysuspect.crossroad"
}

vanillaSetup.go {
	mods {
		rebind_narrator {
			versions += ["1.20.1", "1.21.1", "1.21.5"]
			vars.description = "Adds a keybind to options for the narrator."
		}
		crowmap {
			versions += ["1.20.1", "1.21.1", "1.21.5"]
			vars.description = "Maps update anywhere in your inventory."
		}
		packages {
			versions += ["1.20.1"]
			vars.description = "512 items is all you need. The underpowered barrels mod."
		}
	}
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
		content {
			includeGroup "dev.emi"
		}
	}
}

dependencies {
	packages1_20_1CompileOnly "dev.emi:emi-xplat-mojmap:1.1.22+1.20.1:api"
}

List<Map.Entry<String, MinecraftProvider.Result>> sortedcrafts = vanillaSetup.getMinecrafts().entrySet().stream()
	.sorted((a, b) -> FlexVerComparator.compare(a.key, b.key))
	.toList()

def mergedCraft = crossroad.merge(sortedcrafts.stream().map({it -> it.value.minecraft}).toArray());
logger.lifecycle("MERGEDCRAFT: {}", mergedCraft)

def oldcraft = sortedcrafts.get(0).value;

configurations {
	compileStubs
	
	modderNameLibAnyCompileOnly.extendsFrom compileStubs
	crowmapAnyCompileOnly.extendsFrom compileStubs
	rebindNarratorAnyCompileOnly.extendsFrom compileStubs
	packagesAnyCompileOnly.extendsFrom compileStubs
}

dependencies {
	compileStubs project.files(mergedCraft)
	oldcraft.dependencies.each { compileStubs it }
}

